name: Fix Excel Button UI

on:
  push:
    branches: [ main ]

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Fix button height for Android density
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('app/src/main/java/com/karahan/kirasozlesmesi/MainActivity.kt')
          s = p.read_text(encoding='utf-8')
          old = 'LinearLayout.LayoutParams(-1, 56)'
          new = 'LinearLayout.LayoutParams(-1, (56 * resources.displayMetrics.density).toInt())'
          if old not in s:
              print('Button expression already fixed or not found; no change needed.')
          else:
              p.write_text(s.replace(old, new), encoding='utf-8')
          PY

      - name: Commit UI fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/src/main/java/com/karahan/kirasozlesmesi/MainActivity.kt
          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "Fix Excel button height on Android"
            git push
          fi
